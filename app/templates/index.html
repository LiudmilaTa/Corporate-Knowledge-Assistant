<!DOCTYPE html>
<html lang="en">

<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Corporate Knowledge Assistant</title> 
    <link rel="stylesheet" href="/static/style.css"> 
</head>

<body>

<div class="container">
<header class="header">
    <h1>Corporate Knowledge Assistant</h1>
    <p class="subtitle">
        AI-powered search across company documents
    </p>
    <nav class="navigation">
        <a href="/" class="active">Chat</a>
        <a href="/documents-page">Documents</a>
    </nav>
</header>

<main>
    <section class="chat-section">
        <form id="ask-form">
            <input
                type="text"
                name="question"
                placeholder="Ask something about your documents..."
                autocomplete="off"
                required
            >

            <button id="ask-button" type="submit">
                Ask
            </button>
        </form>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <span>
                AI is analyzing documents...
            </span>
        </div>
    </section>

    <section class="result">
        <h2>Answer</h2>
        <div id="answer" class="answer-box">
            <p class="empty">
                Ask a question about your documents
            </p>
        </div>

        <h3>Sources</h3>
        <div id="sources" class="sources">
        </div>
    </section>
    
    <section class="history-section"> <div class="history-header"> <h2>Chat History</h2>

        <button
            id="refresh-history"
            type="button"
            class="secondary-button"
        >
            Refresh
        </button>
    </div>

    <div id="chat-history">
        Loading chat history...
    </div>

    </section>

</main>

</div>

<script src="/static/script.js"></script>

</body> 

</html>
