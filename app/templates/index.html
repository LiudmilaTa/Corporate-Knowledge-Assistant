<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Corporate Knowledge Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <h1>Corporate Knowledge Assistant</h1>

    <p class="subtitle">
        AI-powered search across company documents
    </p>

   <form id="ask-form">
        <input
            type="text"
            name="question"
            placeholder="Ask something about your documents..."
            required
        >
        <button id="ask-button" type="submit">
            Ask
        </button>
    </form>


    <div id="loading" class="loading">
        <div class="spinner"></div>
        <span>
            AI is analyzing documents...
        </span>
    </div>

    <div class="result">
        <h2>Answer</h2>
        <div id="answer" class="answer-box">
            <p class="empty">
                Ask a question about your documents
            </p>
        </div>

        <h3>Sources</h3>
        <div id="sources" class="sources">
        </div>
    </div>
</div>

<script src="/static/script.js"></script>
