<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Documents - Corporate Knowledge Assistant</title> 
    <link rel="stylesheet" href="/static/style.css"> 
</head>

<body>
<div class="container">
   <header class="header">
    <h1>Documents</h1>
    <p class="subtitle">
        Manage your corporate documents
    </p>
    <nav class="navigation">
        <a href="/">Chat</a>
        <a href="/documents-page" class="active">Documents</a>
    </nav>
</header>

<main>
    <section class="upload-section">
        <h2>Upload document</h2>
        <form id="upload-form">
            <input
                type="file"
                id="file"
                accept=".pdf"
                required
            >
            <button id="upload-button" type="submit">
                Upload
            </button>
        </form>
        <div id="upload-result"></div>
    </section>

    <section class="documents-section">
        <div class="section-header">
            <h2>Uploaded documents</h2>

            <button
                id="refresh-documents"
                type="button"
            >
                Refresh
            </button>
        </div>

        <div id="documents-list">
            Loading documents...
        </div>

    </section>

</main>

</div>

<script src="/static/documents.js"></script>

</body> 

</html>
