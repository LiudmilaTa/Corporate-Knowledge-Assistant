[project]
name = "corporate-knowledge-assistant"
version = "0.1.0"
description = "RAG-powered corporate knowledge assistant"
readme = "README.md"
authors = [
    { name = "taganliu", email = "taganliu@cvut.cz" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.1",
    "fastapi>=0.124.4",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-text-splitters>=1.1.2",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2.13",
    "pydantic>=2.10.6",
    "pypdf>=5.9.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.20",
    "requests>=2.34.2",
    "sentence-transformers>=5.6.1",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.33.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.8.0",
]
